[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geant-carbon-routing"
version = "0.1.0"
description = "Reproducible GNN-driven carbon-aware routing on a GEANT subgraph"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26", "pandas>=2.2", "networkx>=3.3", "matplotlib>=3.9", "torch>=2.5", "xlrd>=2.0", "scipy==1.18.1"]

[project.scripts]
carbon-route = "carbonroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carbonroute = ["report.html", "combined_dashboard.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/carbonroute"]

